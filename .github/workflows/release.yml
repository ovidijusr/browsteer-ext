# Release: push a tag vX.Y.Z (matching "version" in package.json) and this
# builds, tests, signs the Firefox extension with Mozilla (AMO, unlisted channel),
# and publishes a GitHub release with:
#   browsteer-firefox-X.Y.Z.xpi   signed; installed Firefoxes update to it by themselves
#   updates.json                  what Firefox's update check reads (update_url points here)
#   browsteer-chrome-X.Y.Z.zip    for "Load unpacked" or the Chrome Web Store
# See docs/RELEASING.md for the whole flow and the one-time setup.
#
# Credentials: the AMO API key and secret are GitHub secrets of the "amo"
# environment, so only jobs that name that environment can read them, and the
# environment can require a person to approve each run. They are handed to the
# one signing step only; nothing else in the run can see them. This workflow
# runs on tag pushes only (never for pull requests, which is how forks would
# get at secrets), every action is pinned to a commit, and dependencies install
# exactly as locked in bun.lock without lifecycle scripts.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Test, build, sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: amo
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.9

      - name: Tag must match package.json
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "::error::tag $GITHUB_REF_NAME but package.json says $want"; exit 1; fi

      - name: Install dependencies exactly as locked
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build both extensions
        run: bun run build

      - name: Check permissions against the documented set
        run: bun run scripts/check-manifest.ts

      - name: Lint the Firefox build
        run: node_modules/.bin/web-ext lint --source-dir dist/firefox --self-hosted

      - name: Package the Chrome build
        run: bun run package

      # The only step that sees the AMO credentials. Unlisted = signed by Mozilla
      # for self-distribution; it is not published on addons.mozilla.org.
      - name: Sign the Firefox build with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node_modules/.bin/web-ext sign --source-dir dist/firefox --artifacts-dir signed --channel unlisted --approval-timeout 1800000

      - name: Name the signed file and write updates.json
        run: |
          v="$(jq -r .version package.json)"
          xpi="$(ls signed/*.xpi | head -n1)"
          mv "$xpi" "artifacts/browsteer-firefox-$v.xpi"
          bun run scripts/updates-json.ts "artifacts/browsteer-firefox-$v.xpi"

      - name: Hand the files to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            artifacts/browsteer-firefox-*.xpi
            artifacts/browsteer-chrome-*.zip
            artifacts/updates.json
          if-no-files-found: error
          retention-days: 7

  # Runs no project code and no dependencies: it only uploads the files above.
  # It is the only job whose token may write to the repository (to create the release).
  publish:
    name: Publish the GitHub release
    needs: build-and-sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the signed files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Browsteer $GITHUB_REF_NAME" --generate-notes --latest
