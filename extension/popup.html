<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Browsteer</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <img src="icons/48.png" alt="" />
    <span>Browsteer</span>
    <span class="ver" id="ver" title="Installed version"></span>
  </header>

  <button class="key" id="key" type="button" title="Copy the /browse command"><span>bst</span><span>····</span><span>····</span></button>

  <p class="link" id="link" data-state="boot" role="status">
    <span class="lamp" aria-hidden="true"></span>
    <span id="linkText">Checking the bridge…</span>
  </p>

  <div class="actions">
    <button class="btn primary" id="copy" type="button">Copy /browse command</button>
    <button class="btn" id="regen" type="button" title="Replace this browser's key. The old key stops working.">New key</button>
  </div>

  <footer>
    <button class="btn quiet" id="pick" type="button" title="Click any element on the page to get its CSS selector">Pick an element</button>
    <a href="welcome.html" target="_blank" rel="noopener">Setup and privacy</a>
  </footer>
  <p class="picked" id="picked" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
